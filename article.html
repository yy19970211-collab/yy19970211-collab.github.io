<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 光影与数学</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/article.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="shell nav" aria-label="主导航">
      <a class="brand" href="./">光影与数学</a>
      <div class="nav-links">
        <a href="./#about">关于</a>
        <a href="./#visual">可视化</a>
        <a href="./#articles">文章</a>
      </div>
    </nav>
  </header>

  <main class="shell article-wrap">
    <div class="article-head">
      <p class="kicker" id="aDate"></p>
      <h1 class="article-title" id="aTitle"></h1>
      <p class="article-meta" id="aMeta"></p>
    </div>
    <article class="article-body" id="aBody">
      <p class="empty">加载中……</p>
    </article>
    <footer class="article-foot">
      <a class="btn" href="./#articles">← 返回文章列表</a>
      <a class="btn" id="aWechat" href="#" style="display:none">微信原文 ↗</a>
    </footer>
  </main>

  <script src="assets/marked.min.js"></script>
  <script>
    // 渲染 Markdown: 先保护公式占位, 再 marked 渲染, 最后还原为可被 KaTeX 识别的 $..$ 标记
    function renderArticle(md){
      const block=[], inline=[];
      // 1. 保护 $$...$$ 块公式
      md = md.replace(/\$\$([\s\S]+?)\$\$/g, function(_,eq){ block.push(eq); return '\u0001B'+(block.length-1)+'\u0001'; });
      // 2. 保护 $...$ 行内公式
      md = md.replace(/(^|[^\\$])\$([^$\n]+?)\$/g, function(_,pre,eq){ inline.push(eq); return pre+'\u0001I'+(inline.length-1)+'\u0001'; });
      // 3. marked 渲染
      let html = marked.parse(md);
      // 3.5 图片加图注: <img alt="图一 xxx" src="..."> → <figure><img …><figcaption>图一 xxx</figcaption></figure>
      html = html.replace(/<img\b([^>]*)>/g, function(_, attrs){
        const m = attrs.match(/src="([^"]*)"/);
        const a = attrs.match(/alt="([^"]*)"/);
        if(!m || !a) return '<img'+attrs+'>';
        const cap = a[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
        return '<figure class="fig"><img'+attrs+'><figcaption>'+cap+'</figcaption></figure>';
      });
      // 4. 还原行内公式
      html = html.replace(/\u0001I(\d+)\u0001/g, function(_,i){ return '$'+inline[+i]+'$'; });
      // 5. 还原块公式(转成 <div class=math> 防止 marked 二次处理)
      html = html.replace(/\u0001B(\d+)\u0001/g, function(_,i){
        const eq = block[+i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return '<div class="math-block">$$'+eq+'$$</div>';
      });
      return html;
    }
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if(!id){ document.getElementById('aBody').innerHTML='<p class="empty">未指定文章。</p>'; }
    else {
      fetch('articles/index.json').then(r=>r.json()).then(list=>{
        const a = list.find(x=>x.id===id);
        if(!a){ document.getElementById('aBody').innerHTML='<p class="empty">文章不存在。</p>'; return; }
        document.title = a.title + ' · 光影与数学';
        document.getElementById('aTitle').textContent = a.title;
        document.getElementById('aDate').textContent = a.date;
        document.getElementById('aMeta').textContent = a.author;
        if(a.wechat){ const w=document.getElementById('aWechat'); w.href=a.wechat; w.style.display='inline-block'; }
        return fetch(a.file).then(r=>r.text());
      }).then(md=>{
        if(md){
          const body = document.getElementById('aBody');
          body.innerHTML = renderArticle(md);
          // 等待 KaTeX 就绪后渲染公式
          const tryRender = function(){
            if(window.renderMathInElement){
              renderMathInElement(body, {
                delimiters: [
                  {left:'$$', right:'$$', display:true},
                  {left:'$', right:'$', display:false}
                ],
                throwOnError:false
              });
            } else {
              setTimeout(tryRender, 150);
            }
          };
          tryRender();
        }
      }).catch(()=>{
        document.getElementById('aBody').innerHTML='<p class="empty">文章加载失败。</p>';
      });
    }
  </script>
</body>
</html>
