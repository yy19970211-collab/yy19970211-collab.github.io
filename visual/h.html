<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和乐性 (Holonomy) · 交互演示</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0a1520; font-family:"Microsoft YaHei", Arial, sans-serif; }
  #hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10;
          background:rgba(10,21,32,.85); color:#b8c9d8; font-size:13px;
          padding:8px 16px; border:1px solid #2a3a4a; border-radius:20px; white-space:nowrap; }
  #nav { position:fixed; top:14px; left:14px; z-index:20; display:flex; gap:6px;
         background:rgba(10,21,32,.9); border:1px solid #2a3a4a; border-radius:10px; padding:6px 8px; }
  #nav a { color:#b8c9d8; text-decoration:none; font-size:12.5px; padding:4px 10px; border-radius:6px; white-space:nowrap; }
  #nav a:hover { background:#1c2a38; color:#f0c239; }
  #nav a.on { background:#e03c31; color:#fff; }
  #panel { position:fixed; left:16px; bottom:16px; z-index:10; width:320px;
           background:rgba(10,21,32,.94); border:1px solid #2a3a4a; border-radius:12px; padding:14px 16px;
           color:#e8eef2; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #panel label { font-size:12px; color:#93a5b8; }
  input[type=range]{ width:100%; accent-color:#f5b301; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  button { background:#2a3a4a; color:#e8eef2; border:1px solid #3a4c5e; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  button.off { background:#1c2a38; }
  button.mode.active { background:#e03c31; border-color:#e03c31; color:#fff; }
  button.snap.active { background:#f0c239; border-color:#f0c239; color:#1c2413; }
  #status { margin-top:8px; font-size:13px; line-height:1.7; }
  #status b { color:#e03c31; }
  #status .hl { color:#f0c239; }
  .kv { display:flex; justify-content:space-between; gap:10px; }
  .legend { display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; font-size:12px; color:#93a5b8; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
</style>
</head>
<body>
  <div id="nav">
    <a href="index.html">莫比乌斯带</a>
    <a href="holonomy.html" class="on">和乐性</a>
    <a href="ggb/index.html">全局高斯博内</a>
  </div>
  <div id="hint">拖拽旋转 · 滚轮缩放 · 播放/拖滑杆,看切向量绕一圈后留下的和乐角</div>
  <div id="panel">
    <div class="row">
      <button id="modeTri" class="mode active">测地三角形</button>
      <button id="modeLat" class="mode">纬线圈</button>
      <div style="flex:1"></div>
      <button id="snapBtn" class="snap">轨迹快照</button>
      <button id="play">▶ 播放</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <label id="thetaLabel">三角形大小 θ = 70°</label>
    </div>
    <input id="theta" type="range" min="15" max="85" step="1" value="70">
    <div class="row" style="margin-top:8px;">
      <label>路径进度 s</label>
    </div>
    <input id="sweep" type="range" min="0" max="100" step="0.1" value="0">
    <div id="status">
      <div class="kv"><span>月白 = 起点初始方向(不动)</span><span class="hl">朱砂 = 移动中的向量</span></div>
      <div class="kv"><span>向量与路径切向的夹角(边内不变、顶点跳变)</span><b id="acc">0.0°</b></div>
      <div class="kv"><span>回到起点后:和乐角(朱砂 vs 月白)</span><b id="hol">—</b></div>
      <div class="kv"><span id="excessLabel">测地三角形角盈</span><b id="excess">—</b></div>
      <div class="kv"><span id="theoryLabel">理论值</span><b id="theory">—</b></div>
    </div>
    <div class="legend">
      <span><i style="background:#e03c31"></i>朱砂 · 移动向量</span>
      <span><i style="background:#f5b301"></i>藤黄 · 路径</span>
      <span><i style="background:#f0c239"></i>缃色 · 轨迹快照</span>
      <span><i style="background:#d6ecf0"></i>月白 · 初始方向</span>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script>
    // ---------- 中国古典配色 ----------
    const COL = {
      bg:     0x0a1520,   // 玄青
      sphere: 0x1685a9,   // 石青
      grid:   0xd6ecf0,   // 月白
      path:   0xf5b301,   // 藤黄
      cur:    0xe03c31,   // 朱砂
      init:   0xd6ecf0,   // 月白
      trail:  0xf0c239    // 缃色
    };

    // ---------- 场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(COL.bg);
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(4.2, 2.6, 4.6);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(4,6,3); scene.add(dir);

    const R = 1.8;

    // 球体(石青)
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(R, 64, 48),
      new THREE.MeshPhongMaterial({ color:COL.sphere, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false, shininess:20 })
    );
    scene.add(sphere);

    // 经纬网格线(月白)
    const gridPts = [];
    for(let i=0;i<=24;i++){ const f=i*Math.PI*2/24; gridPts.push(new THREE.Vector3(R*Math.cos(f),-R,R*Math.sin(f)), new THREE.Vector3(R*Math.cos(f),R,R*Math.sin(f))); }
    for(let i=0;i<=12;i++){ const th=i*Math.PI/12; const y=R*Math.cos(th), rr=R*Math.sin(th); for(let j=0;j<=24;j++){ const f=j*Math.PI*2/24; gridPts.push(new THREE.Vector3(rr*Math.cos(f),y,rr*Math.sin(f))); } }
    scene.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(gridPts,3)),
      new THREE.LineBasicMaterial({ color:COL.grid, transparent:true, opacity:0.12 })
    ));

    // 路径圆管(藤黄)
    let tubeMesh = null;
    function buildTubeGeom(pts){
      const radius=0.05, tubular=10, pos=[], idx=[];
      const N=pts.length;
      for(let i=0;i<N;i++){
        const p=pts[i].clone().multiplyScalar(R);
        const prev=pts[Math.max(0,i-1)], next=pts[Math.min(N-1,i+1)];
        const t=next.clone().sub(prev); if(t.lengthSq()<1e-12) t.set(0,1,0); t.normalize();
        const ref = Math.abs(t.y)<0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
        const b1=new THREE.Vector3().crossVectors(t, ref).normalize();
        const b2=new THREE.Vector3().crossVectors(t, b1).normalize();
        for(let j=0;j<=tubular;j++){
          const a=j/tubular*Math.PI*2;
          const r1=b1.clone().multiplyScalar(Math.cos(a)).add(b2.clone().multiplyScalar(Math.sin(a)));
          const v=p.clone().addScaledVector(r1, radius);
          pos.push(v.x,v.y,v.z);
        }
      }
      for(let i=0;i<N-1;i++){
        const r0=i*(tubular+1), r1=(i+1)*(tubular+1);
        for(let j=0;j<tubular;j++){
          const a=r0+j,b=r0+j+1,c=r1+j,d=r1+j+1;
          idx.push(a,b,c, b,d,c);
        }
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }
    function setTube(pts){
      const g=buildTubeGeom(pts);
      if(!tubeMesh){
        tubeMesh=new THREE.Mesh(g, new THREE.MeshPhongMaterial({ color:COL.path, emissive:COL.path, emissiveIntensity:0.35, shininess:60 }));
        scene.add(tubeMesh);
      } else {
        tubeMesh.geometry.dispose();
        tubeMesh.geometry=g;
      }
    }

    // 顶点标记(藤黄)
    const vertexDots=[];
    for(let i=0;i<3;i++){
      const d=new THREE.Mesh(new THREE.SphereGeometry(0.055,16,16), new THREE.MeshBasicMaterial({ color:COL.path }));
      scene.add(d); vertexDots.push(d);
    }

    // ---------- 实心圆润箭头 ----------
    function makeSolidArrow(color, opts){
      opts=opts||{};
      const shaftR=opts.shaftR||0.033, headR=opts.headR||0.115, shaftL=opts.shaftL||0.60, headL=opts.headL||0.26;
      const g=new THREE.Group();
      const mat=new THREE.MeshPhongMaterial({ color, emissive:color, emissiveIntensity:0.30, shininess:50 });
      const shaft=new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR*0.85, shaftL, 18), mat);
      shaft.position.y=shaftL/2;
      const head=new THREE.Mesh(new THREE.ConeGeometry(headR, headL, 22), mat);
      head.position.y=shaftL+headL/2;
      g.add(shaft, head);
      g.userData.len=shaftL+headL;
      return g;
    }
    function orientArrow(arrow, dir){
      const up=new THREE.Vector3(0,1,0), d=dir.clone().normalize();
      if(Math.abs(up.dot(d))>0.9999){
        arrow.quaternion.setFromAxisAngle(new THREE.Vector3(1,0,0), up.dot(d)<0 ? Math.PI : 0);
      } else {
        arrow.quaternion.setFromUnitVectors(up, d);
      }
    }
    function placeArrow(arrow, origin, dir, len){
      arrow.position.copy(origin);
      orientArrow(arrow, dir);
      arrow.scale.set(1, len/arrow.userData.len, 1);
    }

    const arrowCur=makeSolidArrow(COL.cur); scene.add(arrowCur);
    const arrowInit=makeSolidArrow(COL.init); scene.add(arrowInit);

    // 轨迹快照箭头(缃色,每 5%)
    const snapArrows=[];
    for(let i=0;i<=20;i++){
      const a=makeSolidArrow(COL.trail, { shaftR:0.018, headR:0.07, shaftL:0.32, headL:0.15 });
      a.visible=false; scene.add(a); snapArrows.push(a);
    }
    let snapOn=false;

    // ---------- 球面工具 ----------
    const clamp01 = v => THREE.MathUtils.clamp(v, -1, 1);
    function vecAt(thetaDeg, lonDeg){
      const th = thetaDeg*Math.PI/180, f = lonDeg*Math.PI/180;
      return new THREE.Vector3(Math.sin(th)*Math.cos(f), Math.cos(th), Math.sin(th)*Math.sin(f));
    }
    function slerp(a, b, t){
      const d = clamp01(a.dot(b));
      const om = Math.acos(d), so = Math.sin(om);
      if (so < 1e-6) return a.clone().lerp(b, t).normalize();
      return a.clone().multiplyScalar(Math.sin((1-t)*om)/so).add(b.clone().multiplyScalar(Math.sin(t*om)/so));
    }

    function buildPath(mode, thetaDeg){
      if (mode === 'tri'){
        const A=vecAt(thetaDeg,0), B=vecAt(thetaDeg,120), C=vecAt(thetaDeg,240);
        const edges=[[A,B],[B,C],[C,A]];
        const pts=[]; const n=80;
        for(const [a,b] of edges) for(let i=0;i<=n;i++) pts.push(slerp(a,b,i/n));
        const v0 = B.clone().addScaledVector(A, -clamp01(A.dot(B))).normalize();
        return { pts, v0, dots:[A,B,C] };
      } else {
        const th=thetaDeg*Math.PI/180, n=360;
        const pts=[];
        for(let i=0;i<=n;i++){ const f=2*Math.PI*i/n; pts.push(new THREE.Vector3(Math.sin(th)*Math.cos(f), Math.cos(th), Math.sin(th)*Math.sin(f))); }
        return { pts, v0: new THREE.Vector3(0,0,1), dots:[pts[0]] };
      }
    }

    // 整段平行移动:返回每个采样点处的传输向量
    function transportAll(pts, v0){
      const out=[v0.clone()];
      let v=v0.clone();
      const axis=new THREE.Vector3(), n=new THREE.Vector3(), q=new THREE.Quaternion();
      for(let i=1;i<pts.length;i++){
        const p0=pts[i-1], p1=pts[i];
        axis.crossVectors(p0,p1); const l=axis.length();
        if(l>1e-9){ axis.multiplyScalar(1/l); q.setFromAxisAngle(axis, Math.acos(clamp01(p0.dot(p1)))); v.applyQuaternion(q); }
        n.copy(p1);
        v.addScaledVector(n,-v.dot(n)).normalize();
        out.push(v.clone());
      }
      return out;
    }

    // 有向转角:绕法向 n 的带符号转角,范围 (-180, 180]
    function signedAngle(vA, vB, n){
      const cross = new THREE.Vector3().crossVectors(vA,vB);
      const s = cross.dot(n);
      const c = clamp01(vA.dot(vB));
      return Math.atan2(s, c) * 180/Math.PI;
    }

    // 测地三角形三内角与角盈
    function triangleExcess(thetaDeg){
      const A=vecAt(thetaDeg,0), B=vecAt(thetaDeg,120), C=vecAt(thetaDeg,240);
      const at = (X, P, Q) => {
        const cXP=clamp01(X.dot(P)), cXQ=clamp01(X.dot(Q));
        const tP = P.clone().addScaledVector(X,-cXP).normalize();
        const tQ = Q.clone().addScaledVector(X,-cXQ).normalize();
        return Math.acos(clamp01(tP.dot(tQ)));
      };
      const aA=at(A,C,B), aB=at(B,A,C), aC=at(C,B,A);
      const sum=(aA+aB+aC)*180/Math.PI;
      return { sum, excess: sum-180, angles:[aA,aB,aC] };
    }

    // ---------- 状态与缓存 ----------
    let mode='tri', theta=70, s=0, playing=false;
    let cacheKey='', cached=null;
    function ensureCache(){
      const key=mode+':'+theta;
      if(cached && cacheKey===key) return cached;
      const { pts, v0, dots } = buildPath(mode, theta);
      const transported = transportAll(pts, v0);
      cacheKey=key;
      cached={ pts, v0, dots, transported };
      return cached;
    }

    function updateSnapshots(pts, transported){
      const N=pts.length;
      for(let k=0;k<=20;k++){
        const idx=Math.round(k*(N-1)/20);
        placeArrow(snapArrows[k], pts[idx].clone().multiplyScalar(R), transported[idx], 0.5);
        snapArrows[k].visible=true;
      }
    }
    let snapKey='';

    function refresh(){
      const { pts, v0, dots, transported } = ensureCache();
      const N=pts.length;
      // 路径圆管 + 顶点
      setTube(pts);
      vertexDots.forEach((d,i)=>{ d.visible = i < dots.length; if(i<dots.length) d.position.copy(dots[i]).multiplyScalar(R); });
      // 轨迹快照(仅在路径变化时重建)
      if(snapOn && snapKey!==cacheKey){ updateSnapshots(pts, transported); snapKey=cacheKey; }
      // 月白箭头:钉在起点不动
      placeArrow(arrowInit, pts[0].clone().multiplyScalar(R), v0, 0.95);
      // 朱砂箭头:当前平移位置
      const maxI=Math.max(0, Math.min(N-1, Math.round(s*(N-1))));
      const vB=transported[maxI], curP=pts[maxI];
      placeArrow(arrowCur, curP.clone().multiplyScalar(R), vB, 0.95);
      // 与路径切向的夹角
      const idxA=Math.max(0,maxI-1), idxB=Math.min(N-1,maxI+1);
      const t=pts[idxB].clone().sub(pts[idxA]).normalize();
      const toTangent=Math.acos(THREE.MathUtils.clamp(vB.dot(t),-1,1))*180/Math.PI;
      document.getElementById('acc').textContent=toTangent.toFixed(1)+'°';
      // 和乐角
      document.getElementById('excessLabel').textContent=(mode==='tri')?'测地三角形角盈':'—';
      document.getElementById('theoryLabel').textContent=(mode==='tri')?'和乐角(回到起点)':'理论值 2π(1−cosθ)';
      const holEl=document.getElementById('hol');
      if(s>=0.999){
        const raw=signedAngle(v0, vB, curP);
        const hol=raw<0 ? Math.abs(raw) : 360-Math.abs(raw);
        holEl.textContent=hol.toFixed(1)+'°';
      } else {
        holEl.textContent='—';
      }
      if(mode==='tri'){
        const ex=triangleExcess(theta);
        document.getElementById('excess').textContent=ex.excess.toFixed(1)+'°  (内角和 '+ex.sum.toFixed(1)+'°)';
        document.getElementById('theory').textContent='应为角盈 '+ex.excess.toFixed(1)+'°';
      } else {
        document.getElementById('excess').textContent='—';
        const th=theta*Math.PI/180;
        document.getElementById('theory').textContent=((2*Math.PI*(1-Math.cos(th)))*180/Math.PI).toFixed(1)+'°';
      }
    }

    const thetaInput=document.getElementById('theta');
    const thetaLabel=document.getElementById('thetaLabel');
    thetaInput.addEventListener('input',()=>{ theta=+thetaInput.value; thetaLabel.textContent=(mode==='tri')?('三角形大小 θ = '+theta+'°'):('纬线纬度 θ = '+theta+'°'); refresh(); });

    const sweepInput=document.getElementById('sweep');
    sweepInput.addEventListener('input',()=>{ s=+sweepInput.value/100; refresh(); });

    const modeTri=document.getElementById('modeTri'), modeLat=document.getElementById('modeLat');
    function setMode(m){
      mode=m; playing=false; s=0; sweepInput.value=0; document.getElementById('play').textContent='▶ 播放';
      modeTri.classList.toggle('active', mode==='tri'); modeLat.classList.toggle('active', mode==='lat');
      thetaLabel.textContent=(mode==='tri')?('三角形大小 θ = '+theta+'°'):('纬线纬度 θ = '+theta+'°');
      refresh();
    }
    modeTri.addEventListener('click',()=>setMode('tri'));
    modeLat.addEventListener('click',()=>setMode('lat'));

    const snapBtn=document.getElementById('snapBtn');
    snapBtn.addEventListener('click',()=>{
      snapOn=!snapOn;
      snapBtn.classList.toggle('active', snapOn);
      if(snapOn){ const c=ensureCache(); updateSnapshots(c.pts, c.transported); snapKey=cacheKey; }
      else snapArrows.forEach(a=>a.visible=false);
    });

    const playBtn=document.getElementById('play');
    playBtn.addEventListener('click',()=>{ playing=!playing; playBtn.textContent=playing?'⏸ 暂停':'▶ 播放'; playBtn.classList.toggle('off',playing); });

    function animate(){
      requestAnimationFrame(animate);
      if(playing){
        s+=0.0016;
        if(s>=1) s=0;
        sweepInput.value=s*100;
        refresh();
      }
      controls.update();
      renderer.render(scene,camera);
    }
    animate();
    addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

    refresh();
  </script>
</body>
</html>
