<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全局高斯博内公式 · 可视化证明流程</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root{ --bg:#0a1520; --panel:#101c2a; --border:#2a3a4a; --text:#e8eef2; --dim:#93a5b8;
    --shiqing:#1685a9; --tenghuang:#f5b301; --zhusha:#e03c31; --xiangse:#f0c239; --yuebai:#d6ecf0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font-family:"Microsoft YaHei", Arial, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:rgba(10,21,32,.9); }
  header h1 { font-size:16px; margin:0; } .meta { margin-left:auto; font-size:12px; color:var(--dim); }
  #nav { display:flex; gap:6px; }
  #nav a { color:var(--dim); text-decoration:none; font-size:12.5px; padding:4px 10px; border-radius:6px; white-space:nowrap; border:1px solid var(--border); }
  #nav a:hover { color:var(--tenghuang); }
  #nav a.on { background:var(--zhusha); border-color:var(--zhusha); color:#fff; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:392px; min-width:300px; overflow-y:auto; padding:16px 18px; background:rgba(16,28,42,.75);
          border-right:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  #stepTitle { font-size:17px; font-weight:700; color:var(--tenghuang); }
  #narrative p { margin:0 0 10px; font-size:13.5px; line-height:1.75; color:#c7d3de; }
  #narrative b { color:var(--zhusha); } #narrative .f { color:var(--tenghuang); font-weight:600; }
  .ctl { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .ctl label { font-size:12px; color:var(--dim); white-space:nowrap; }
  .ctl input[type=range]{ flex:1; min-width:100px; accent-color:var(--tenghuang); }
  .ctl input[disabled]{ opacity:.35; }
  .ctl .ctlval { font-size:12px; color:var(--xiangse); min-width:34px; text-align:right; }
  .ctl button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px;
                padding:5px 12px; cursor:pointer; font-size:12.5px; transition:.15s; }
  .ctl button:hover { border-color:var(--shiqing); color:var(--yuebai); }
  .ctl button.on, .ctl button.active { background:var(--zhusha); border-color:var(--zhusha); color:#fff; }
  .ctl.kind-part { border-top:2px solid var(--tenghuang); padding-top:6px; }
  .ctl.kind-part button { font-size:15px; padding:7px 16px; font-weight:700; background:linear-gradient(180deg,#1a2c40,#0f1a28); border-width:2px; }
  .ctl.kind-part button.on { background:linear-gradient(180deg,#e03c31,#b02a20); border-color:#ffb3ab; box-shadow:0 0 10px rgba(224,60,49,.35); }
  .ctl.kind-stage button { font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  .ctl.kind-stage button::before { content:attr(data-n); margin-right:3px; font-size:10px; color:var(--shiqing); opacity:.9; }
  .ctl.kind-stage button.on::before { color:#ffd9d5; }
  .ctl.kind-poly button { font-size:11px; padding:4px 9px; border-radius:6px; border-style:dashed; color:var(--yuebai); }
  .ctl.kind-poly button.on { border-style:solid; background:#7a5b12; border-color:var(--xiangse); }
  .vals { background:rgba(16,28,42,.9); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
          font-size:12.5px; line-height:1.8; color:#c7d3de; }
  .vals b { color:var(--xiangse); } .vals .big { font-size:14px; color:var(--tenghuang); font-weight:700; }
  .ck { border:1px solid var(--border); border-left:3px solid var(--zhusha); border-radius:8px; padding:8px 12px;
        background:rgba(10,21,32,.6); }
  .ck .ck-label { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .ck .ck-row { font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .ck .ck-t { color:var(--dim); } .ck .ck-m { color:var(--xiangse); font-weight:600; } .ck .ck-ok { color:#6fd08a; }
  #view { flex:1; position:relative; }
  .toolbar { position:absolute; left:14px; top:14px; display:flex; gap:8px; align-items:center; }
  .toolbar button, .toolbar .hint { background:rgba(16,28,42,.9); color:var(--text); border:1px solid var(--border);
    border-radius:20px; padding:6px 14px; cursor:pointer; font-size:12.5px; }
  .toolbar .hint { color:var(--dim); white-space:nowrap; cursor:default; }
  footer { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px;
           border-top:1px solid var(--border); background:rgba(10,21,32,.9); }
  footer button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px;
                  padding:6px 16px; cursor:pointer; font-size:13px; }
  .dots { display:flex; gap:8px; }
  .dot { width:26px; height:26px; border-radius:50%; border:1px solid var(--border); color:var(--dim);
         font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--panel); }
  .dot.active { background:var(--zhusha); border-color:var(--zhusha); color:#fff; }
</style>

// ============ 原语(R=1) ============
const clamp01 = v => THREE.MathUtils.clamp(v, -1, 1);
function vecAt(thetaDeg, lonDeg){ const th=thetaDeg*Math.PI/180, f=lonDeg*Math.PI/180;
  return new THREE.Vector3(Math.sin(th)*Math.cos(f), Math.cos(th), Math.sin(th)*Math.sin(f)); }
function slerp(a,b,t){ const d=clamp01(a.dot(b)), om=Math.acos(d), so=Math.sin(om);
  if(so<1e-6) return a.clone().lerp(b,t).normalize();
  return a.clone().multiplyScalar(Math.sin((1-t)*om)/so).add(b.clone().multiplyScalar(Math.sin(t*om)/so)); }
function slerpArc(a,b,n){ const out=[]; for(let i=0;i<=n;i++) out.push(slerp(a,b,i/n)); return out; }
function tangentToward(X,Q){ const c=clamp01(X.dot(Q)); return Q.clone().addScaledVector(X,-c).normalize(); }
function triAnglesRad(A,B,C){
  return [ Math.acos(clamp01(tangentToward(A,C).dot(tangentToward(A,B)))),
           Math.acos(clamp01(tangentToward(B,A).dot(tangentToward(B,C)))),
           Math.acos(clamp01(tangentToward(C,B).dot(tangentToward(C,A)))) ]; }
function triExcessRad(A,B,C){ const a=triAnglesRad(A,B,C); return a[0]+a[1]+a[2]-Math.PI; }
function subdivide(tri, level){
  if(level<=0) return [tri];
  const [A,B,C]=tri; const AB=slerp(A,B,.5), BC=slerp(B,C,.5), CA=slerp(C,A,.5);
  return [...subdivide([A,AB,CA],level-1), ...subdivide([AB,B,BC],level-1),
          ...subdivide([CA,BC,C],level-1), ...subdivide([AB,BC,CA],level-1)]; }
// 索引式细分:相邻三角形共享顶点与边(精确,不靠坐标舍入)
function subdivIndexed(tri, level){
  let v=[tri[0],tri[1],tri[2]];
  let f=[[0,1,2]];
  for(let s=0;s<level;s++){
    const mm={}, nv=[];
    const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a;
      if(mm[k]===undefined){ nv.push(slerp(v[a],v[b],.5)); mm[k]=v.length+nv.length-1; }
      return mm[k]; };
    const nf=[];
    for(const t of f){ const [a,b,c]=t; const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      nf.push([a,ab,ca],[ab,b,bc],[ca,bc,c],[ab,bc,ca]); }
    v=v.concat(nv); f=nf;
  }
  return { verts:v, faces:f }; }

function subdivPoly(P,sub){ let verts=P.verts.map(p=>p.slice()), triF=[];

function icosaGeodesic(detail){

      const l=Math.hypot(m[0],m[1],m[2])||1; nv.push([m[0]/l,m[1]/l,m[2]/l]); mm[k]=v.length+nv.length-1; }

// 水滴形(闭 genus-0 曲面,参数网格,作备份曲面)
function teardropGeometry(Rad,U,Vv){
  Rad=Rad||1.35; U=U||40; Vv=Vv||60;
  const verts=[], idx=[], ids=[];
  for(let i=0;i<=U;i++){
    const u=i/U*Math.PI;
    const r=Math.sin(u)*Math.pow(1+Math.cos(u),1/3)*Rad;
    const z=Math.cos(u)*Rad*1.2;
    if(i===0||i===U){ ids.push([verts.length/3]); verts.push(0,0,z); }
    else { ids.push([]); const row=ids[i];
      for(let j=0;j<Vv;j++){ const v=j/Vv*Math.PI*2; verts.push(r*Math.cos(v),r*Math.sin(v),z); row.push(verts.length/3-1); } }
  }
  for(let i=0;i<U;i++) for(let j=0;j<Vv;j++){
    const jn=(j+1)%Vv;
    const aI=ids[i].length===1?ids[i][0]:ids[i][j];
    const bI=ids[i].length===1?ids[i][0]:ids[i][jn];
    const cI=ids[i+1].length===1?ids[i+1][0]:ids[i+1][j];
    const dI=ids[i+1].length===1?ids[i+1][0]:ids[i+1][jn];
    if(ids[i].length===1) idx.push(aI,cI,dI);
    else if(ids[i+1].length===1) idx.push(aI,bI,cI);
    else idx.push(aI,bI,cI, cI,bI,dI);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// 水滴形测地线求解器(旋转体表面,数值解测地线)
function tearProfile(u){ return { r:Math.sin(u)*Math.pow(1+Math.cos(u),1/3), y:Math.cos(u)*1.2 }; }
function tearPoint(u,v){ const p=tearProfile(u); return { x:p.r*Math.cos(v), y:p.y, z:p.r*Math.sin(v) }; }
// 光滑水滴参数曲面(解析法向,干净如球面)
function tearSurfaceGeo(U,Vv){

  const du=1e-6;
  function pushRow(r,y,nrmY){ // nrmY: 法线y分量基准
    const row=[];
    for(let j=0;j<Vv;j++){ const v=j/Vv*Math.PI*2;
      pos.push(r*Math.cos(v), y, r*Math.sin(v));
      // 法线: 近似径向
      const n=[Math.cos(v), nrmY, Math.sin(v)];
      const l=Math.hypot(n[0],n[1],n[2])||1; nrm.push(n[0]/l,n[1]/l,n[2]/l);
      row.push(pos.length/3-1);

  for(let i=1;i<U;i++){ const u=i/U*Math.PI, p=tearProfile(u); bodyR.push(p.r); bodyY.push(p.y); }
  // 顶部半球帽: 端点 y1=1.2 (tearProfile(0).y), 半径从0(顶点)到 bodyR[0]
  const yTop=tearProfile(0).y, rTop=bodyR[0], y1=bodyY[0];

  // 圆弧: 从顶点向下, 圆心在 (0, yTop - rTop)? 让圆切主体
  // 简化: 顶部行半径从0线性到rTop(共capN行), y从yTop到y1(线性)
  const capN=4;
  for(let c=capN-1;c>=0;c--){
    const f=(capN-c)/capN;      // c=capN-1 → f接近0(顶点), c=0 → f=1(主体)
    const ang=(1-f)*(Math.PI/2); // f=0 → 90°(顶点), f=1 → 0°(主体)

    const y=yB1 + (yBot-yB1)*Math.cos(ang);
    pushRow(r, y, Math.cos(ang)>0.01?-1:-0.5);

  const N=ids.length;
  for(let i=0;i<N-1;i++) for(let j=0;j<Vv;j++){
    const jn=(j+1)%Vv;
    const a=ids[i][j], b=ids[i][jn], c=ids[i+1][jn], d=ids[i+1][j];
    idx.push(a,b,c, a,c,d);

  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));

function tearEFG(u){
  const du=1e-6;
  const p0=tearProfile(u), p1=tearProfile(u+du), pm=tearProfile(u-du);
  const rp=(p1.r-pm.r)/(2*du), yp=(p1.y-pm.y)/(2*du);

function tearXYZtoUV(p){ // 水滴上的点→参数: y=1.2 cos u

function tearIntegrate(u0,v0,alpha,ds){
  const f0=tearEFG(u0);
  let u_=Math.cos(alpha)/Math.sqrt(f0.E), v_=Math.sin(alpha)/Math.sqrt(f0.G);
  let u=u0,v=v0; const pts=[{u,v}]; let s=0;
  while(s<5){
    const f=tearEFG(u);
    const u__=-(f.Eu/(2*f.E))*u_*u_+(f.Gu/(2*f.E))*v_*v_;
    const v__=-(f.Gu/f.G)*u_*v_;
    u_+=u__*ds; v_+=v__*ds; u+=u_*ds; v+=v_*ds; s+=ds; pts.push({u,v});
    if(u<0.02||u>Math.PI-0.02) break;
  }
  return pts;
}
// 计算 A->B 的测地线弧(切平面投影作初始方向 + 局部精修)
function tearGeodesic(A,B){
  const a=tearXYZtoUV(A), b=tearXYZtoUV(B);
  const du=1e-6, pA=tearProfile(a.u), pu=tearProfile(a.u+du);
  const eu={x:(pu.r*Math.cos(a.v)-pA.r*Math.cos(a.v))/du, y:(pu.y-pA.y)/du, z:(pu.r*Math.sin(a.v)-pA.r*Math.sin(a.v))/du};
  const ev={x:-pA.r*Math.sin(a.v), y:0, z:pA.r*Math.cos(a.v)};
  const w={x:B.x-A.x, y:B.y-A.y, z:B.z-A.z};
  const n={x:eu.y*ev.z-eu.z*ev.y, y:eu.z*ev.x-eu.x*ev.z, z:eu.x*ev.y-eu.y*ev.x};
  const nw=n.x*w.x+n.y*w.y+n.z*w.z, nn=n.x*n.x+n.y*n.y+n.z*n.z;
  const wt={x:w.x-n.x*nw/nn, y:w.y-n.y*nw/nn, z:w.z-n.z*nw/nn};
  const aE=wt.x*eu.x+wt.y*eu.y+wt.z*eu.z, aV=wt.x*ev.x+wt.y*ev.y+wt.z*ev.z;
  const alpha0=Math.atan2(aV,aE);
  function miss(al){ const pts=tearIntegrate(a.u,a.v,al,0.002);
    let md=1e9; for(const p of pts){ const q=tearPoint(p.u,p.v);
      const d=(q.x-B.x)*(q.x-B.x)+(q.y-B.y)*(q.y-B.y)+(q.z-B.z)*(q.z-B.z); if(d<md)md=d; } return md; }
  let best=alpha0, bm=miss(alpha0);
  for(let k=1;k<=14;k++){ const al=alpha0+(k%2?k*0.04:-k*0.04); const m=miss(al); if(m<bm){bm=m;best=al;} }
  const pts=tearIntegrate(a.u,a.v,best,0.002);
  let ci=0,md=1e9;
  for(let i=0;i<pts.length;i++){ const q=tearPoint(pts[i].u,pts[i].v);
    const d=(q.x-B.x)*(q.x-B.x)+(q.y-B.y)*(q.y-B.y)+(q.z-B.z)*(q.z-B.z); if(d<md){md=d;ci=i;} }
  const out=[]; for(let i=0;i<=ci;i++){ const q=tearPoint(pts[i].u,pts[i].v); out.push(new THREE.Vector3(q.x,q.y,q.z)); }
  out.push(new THREE.Vector3(B.x,B.y,B.z));
  out.__miss=Math.sqrt(md);
  return out;
}

    const squareTube=(points,s)=>{ const pos=[],idx=[]; const Np=points.length;

            sceneG.add(makeLine([new THREE.Vector3(verts[a][0],verts[a][1],verts[a][2]),new THREE.Vector3(verts[b][0],verts[b][1],verts[b][2])],COL.E,0.6)); }

        '<div style="color:#93a5b8">先看曲面有几个洞(亏格)。球面 0 洞、环面 1 洞、双环面 2 洞。</div>';

{ // ⑤ 全局高斯博内:五步证明

  ],

  activate(ctx){
    const g=new THREE.Group(); ctx.group.add(g);

    let tearGeoMap=new Map();
    const rebuildTearMap=()=>{ const td=tearData(); tearGeoMap=new Map(); td.ED.forEach((e,i)=>tearGeoMap.set(e[0]<e[1]?e[0]+'_'+e[1]:e[1]+'_'+e[0],td.G[i])); };
    const edgeCurve=(i,j)=>{ if(surf==='sphere') return slerpArc(V3(verts[i]),V3(verts[j]),10).map(p=>p.clone().multiplyScalar(R));
      const g2=tearGeoMap.get(i<j?i+'_'+j:j+'_'+i); return g2? g2.map(p=>new THREE.Vector3(p[0],p[1],p[2])) : [V3(verts[i]),V3(verts[j])]; };
    const V3=a=>new THREE.Vector3(a[0],a[1],a[2]);
    const un3=a=>{ const x=a.x!==undefined?a.x:a[0], y=a.y!==undefined?a.y:a[1], z=a.z!==undefined?a.z:a[2];
      const l=Math.hypot(x,y,z)||1; return new THREE.Vector3(x/l,y/l,z/l); };
    const fmt=x=>x.toFixed(3);
    const DENSE_COL=[COL.trail,COL.trail,COL.init];
    const LABS=0.26, LABM=0.3;
    const setMath=()=>{ try{ if(window.katex){ document.querySelectorAll('#vals .math').forEach(el=>{ el.innerHTML=katex.renderToString(el.textContent,{throwOnError:false}); }); } else { setTimeout(setMath,250); } }catch(e){} };
    // 曲面三角形(曲面上的区域)填充:球面=细分贴合;水滴=平三角
    const surfFillGeo=(A,B,C)=>{ const sub=ctx.subdivIndexed([un3(A),un3(B),un3(C)],2);
      const pos=[]; for(const v of sub.verts) pos.push(v.x*R,v.y*R,v.z*R);
      const idx=[]; for(const t of sub.faces) idx.push(t[0],t[1],t[2]);
      const ge=new THREE.BufferGeometry();
      ge.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); ge.setIndex(idx); ge.computeVertexNormals();
      return ge; };
    const flatFillGeo=(A,B,C)=>{ const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute([A.x,A.y,A.z,B.x,B.y,B.z,C.x,C.y,C.z],3));

    const tearFillGeo=(fi)=>{ const t=faces[fi];
      const VV=i=>V3(verts[i]);
      const geoFor=(i,j)=>{ const k=i<j?i+'_'+j:j+'_'+i; const g=tearGeoMap.get(k); return g?g.map(p=>new THREE.Vector3(p[0],p[1],p[2])):[VV(i),VV(j)]; };
      const eA=geoFor(t[0],t[1]), eB=geoFor(t[1],t[2]), eC=geoFor(t[2],t[0]); // A:B v0→v1, B: v1→v2, C: v2→v0
      const pos=[], idx=[], vid=new Map();
      const add=v=>{ const key=v.x.toFixed(5)+','+v.y.toFixed(5)+','+v.z.toFixed(5);
        if(!vid.has(key)){ vid.set(key,pos.length/3); pos.push(v.x,v.y,v.z); } return vid.get(key); };
      const interp=(c,tt)=>{ const q=tt*(c.length-1); const i=Math.min(c.length-2,Math.floor(q)); const f=q-i;
        return new THREE.Vector3(c[i].x+(c[i+1].x-c[i].x)*f, c[i].y+(c[i+1].y-c[i].y)*f, c[i].z+(c[i+1].z-c[i].z)*f); };
      const subC=(c,t0,t1)=>{ const o=[]; for(let k=0;k<=10;k++) o.push(interp(c,t0+(t1-t0)*k/10)); return o; };
      const rev=c=>c.slice().reverse();
      const uvC=(p,q)=>{ const a=ctx.tearXYZtoUV(p), b=ctx.tearXYZtoUV(q); const dv=b.v-a.v; const o=[];
        for(let k=0;k<=10;k++){ const f=k/10; const u=a.u+(b.u-a.u)*f, v=a.v+dv*f; const P=ctx.tearPoint(u,v); o.push(new THREE.Vector3(P.x,P.y,P.z)); } return o; };
      const fillTri=(c1,c2,c3)=>{ // 边界段用弧中点细分,消除平面三角在曲面边上的塌陷缝隙

        for(let k=1;k<c2.length;k++) loop.push(c2[k]);

          const m=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);

      const midc=c=>interp(c,0.5);

        subdiv(subC(c1,0,0.5), rev(n31), rev(subC(c3,0.5,1)), depth-1);
        subdiv(subC(c2,0,0.5), rev(n12), rev(subC(c1,0.5,1)), depth-1);

      }
      subdiv(eA, eB, eC, 2);
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setIndex(idx); g.computeVertexNormals();

    const addFaceHighlight=(fi,color,op)=>{ const t=faces[fi];

    const resetSel=()=>{ selT.clear(); selVv.clear(); sumExcess=0; allTri=false; allVert=false; lastFace=null; };

        html+='<div style="font-size:15px;margin:6px 0 10px 0">'+(c||'请点亮 F/E/V 按钮')+'</div>';
        if(showF) html+='<div style="color:#4c8dff;margin:4px 0">F = 曲面三角形个数(蓝色曲面区域)</div>';
        if(showE) html+='<div style="color:#3fb950;margin:4px 0">E = 公共边总数(绿色弧)</div>';
        if(showV) html+='<div style="color:#f85149;margin:4px 0">V = 顶点总数(红球=所有顶点)</div>';
        if(showF||showE||showV) html+='<div style="margin-top:8px">χ=V−E+F='+V+'−'+E+'+'+F+'=<b>'+chi+'</b></div>';
      } else if(substep===2){
        html+='<div class="big">② 点击曲面上的三角形,看它的角盈</div>';
        if(lastFace===null) html+='<div>点一个三角形(参数会标在 3D 里)</div>';
        else { const t=faces[lastFace];
          const ag=ctx.triAnglesRad(un3(verts[t[0]]),un3(verts[t[1]]),un3(verts[t[2]]));
          html+='<div>α='+fmt(ag[0])+', β='+fmt(ag[1])+', γ='+fmt(ag[2])+'</div>'+
            '<div class="big">角盈 = (α+β+γ) − π = '+fmt(ag[0]+ag[1]+ag[2]-Math.PI)+' rad</div>'; }
      } else if(substep===3){
        html+='<div class="big">③ 点三角形累积 Σ角盈(与 F 的关系)</div>';
        html+='<div style="margin:4px 0 10px 10px;padding:8px 10px;background:rgba(76,141,255,0.12);border-left:3px solid #4c8dff;border-radius:6px"><div class="math" style="color:#4c8dff">\\int\\!\\!\\int_S K\\,dA = \\sum_i \\int\\!\\!\\int_{T_i} K\\,dA = \\sum_i(\\text{内角和}_i) - \\pi F</div></div>';
        html+='<div>已选 <b>'+selT.size+'</b> 个,Σ角盈=<b>'+fmt(sumExcess)+'</b> rad(标在 3D)</div>';
        if(allTri) html+='<div class="big">全部:Σ角盈 = 2π×'+fmt(sumExcess/(2*Math.PI))+' = '+fmt(sumExcess)+' rad(χ='+chi+',2πχ)</div>';
        html+='<div style="color:#93a5b8">F=曲面三角形个数:每个贡献"内角和−π",全加得 Σ内角和−πF=2πχ。这就是 Σ_i∫∫K dA。</div>';
      } else if(substep===4){
        html+='<div class="big">④ 点击顶点累积 Σ内角和</div>';
        html+='<div style="margin:4px 0 10px 10px;padding:8px 10px;background:rgba(248,81,73,0.12);border-left:3px solid #f85149;border-radius:6px"><div class="math" style="color:#f85149">\\sum_i \\int\\!\\!\\int_{T_i} K\\,dA = \\sum_i(\\text{内角和}_i) = 2\\pi V</div></div>';
        html+='<div>已选 <b>'+selVv.size+'</b> 个顶点,Σ内角和=2π·'+(allVert?V:selVv.size)+'=<b>'+fmt(2*Math.PI*(allVert?V:selVv.size))+'</b> rad(标在 3D)</div>';
        if(allVert) html+='<div class="big">全部:Σ内角和 = 2π·V = 2π×'+V+' = '+fmt(2*Math.PI*V)+' rad</div>';
      } else {
        const k = animOn ? Math.min(F, Math.floor(animCount/3)+1) : F;
        const claim = animOn ? '3\\times '+k+' = '+ (3*k) +' \\text{ 条边(已数前 }'+k+'\\text{ 个三角形)}' : '3F = '+3*F+' = 2E = '+2*E+' \\;\\Longrightarrow\\; E = \\tfrac{3F}{2}';
        html+='<div class="big" style="margin-bottom:10px">⑤ 结论</div>'+
          '<div style="margin:10px 0 4px 0;font-weight:700;color:#3fb950"><b>i. 边计数</b>(播放动画)</div>'+
          '<div class="math" style="margin:0 0 12px 12px">'+claim+'</div>'+
          '<div style="margin:10px 0 4px 0;font-weight:700;color:#f0c239"><b>ii. 欧拉示性数</b></div>'+
          '<div class="math" style="margin:0 0 12px 12px">\\chi = V-E+F = V-\\tfrac{F}{2} = '+V+'-'+F/2+' = '+chi+'</div>'+
          '<div style="margin:10px 0 4px 0;font-weight:700;color:#f85149"><b>iii. 角盈求和</b></div>'+
          '<div class="math" style="margin:0 0 12px 12px">\\sum \\text{角盈} = 2\\pi V - \\pi F = 2\\pi(V-E+F) = 2\\pi\\chi</div>'+
          '<div style="margin:10px 0 4px 0;font-weight:700;color:#4c8dff"><b>iv. 全局高斯博内</b></div>'+
          '<div class="math" style="margin:0 0 6px 12px">\\int\\!\\!\\int_S K\\, dA = 2\\pi\\chi = 2\\pi\\times '+chi+' = '+fmt(2*Math.PI*chi)+'</div>';
      }
      valsEl.innerHTML=html;
      setMath();
      ctx.setCK(0,'2πχ='+fmt(2*Math.PI*2),'∫∫K='+fmt(2*Math.PI*chi),chi===2);
    };
    const substepSpecs=()=>{
      const base=[
        {type:'seg', id:'substep', label:'证明步骤', value:substep, options:[
          {label:'① F·E·V', value:1},{label:'② 三角形角盈', value:2},{label:'③ 求和(与F)', value:3},
          {label:'④ 顶点角', value:4},{label:'⑤ 结论', value:5}]},
        {type:'seg', id:'surf', label:'曲面', value:surf, options:[
          {label:'球面', value:'sphere'},{label:'水滴形', value:'drop'}]},
        {type:'seg', id:'dense', label:'剖分', value:dense, options:[
          {label:'粗', value:0},{label:'中', value:1},{label:'细', value:2}]}
      ];
      if(substep===1) base.push({type:'toggle',id:'showF',label:'F 面(蓝)'},{type:'toggle',id:'showE',label:'E 边(绿)'},{type:'toggle',id:'showV',label:'V 顶点(红)'});
      if(substep>=3) base.push({type:'btn',id:'all',label:'全部求和 ALL'});
      if(substep===5) base.push({type:'btn',id:'anim',label:'▶ 动画数边 3F→2E'});
      if(substep===3||substep===4) base.push({type:'btn',id:'clear',label:'清除'});
      return base;
    };
    const setAllBtnClass=()=>{ try{ const bs=document.querySelectorAll('#controls .ctl button');
      const active=(substep===3&&allTri)||(substep===4&&allVert)||(substep===5&&allTri);
      for(const b of bs){ if(b.textContent.indexOf('全部求和')>=0){ b.classList.toggle('on',active); } } }catch(e){} };
    const handleControl=(id,v)=>{
      let geomChange=false;
      if(id==='substep'){ substep=v; resetSel(); showF=showE=showV=false; geomChange=true; }
      if(id==='surf'){ surf=v; resetSel(); showF=showE=showV=false; tearEdges=null; geomChange=true; }
      if(id==='dense'){ dense=v; resetSel(); tearEdges=null; geomChange=true; }
      if(id==='showF')showF=v; if(id==='showE')showE=v; if(id==='showV')showV=v;
      if(id==='all'){
        if(substep===3){ selT.clear(); sumExcess=0; for(const t of faces) sumExcess+=ctx.triExcessRad(un3(verts[t[0]]),un3(verts[t[1]]),un3(verts[t[2]])); allTri=true; }
        if(substep===4){ selVv.clear(); allVert=true; }
        if(substep===5){ selT.clear(); selVv.clear(); sumExcess=0; for(const t of faces) sumExcess+=ctx.triExcessRad(un3(verts[t[0]]),un3(verts[t[1]]),un3(verts[t[2]])); allTri=true; allVert=true; }
      }
      if(id==='clear'){ resetSel(); }
      if(id==='anim'){ animOn=!animOn; if(animOn) animCount=0; renderHighlights(); updatePanel(); setAllBtnClass(); return; }
      if(geomChange){ ctx.rebuildControls(substepSpecs(),(a,b)=>handleControl(a,b)); buildSurface(); }
      renderHighlights(); updatePanel(); setAllBtnClass();
    };
    const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
    let px=0,py=0;
    const onDown=e=>{ px=e.clientX; py=e.clientY; };
    const onUp=e=>{
      if(substep!==2&&substep!==3&&substep!==4) return;
      if(Math.hypot(e.clientX-px,e.clientY-py)>6) return;
      const rect=renderer.domElement.getBoundingClientRect();
      mouse.x=((e.clientX-rect.left)/rect.width)*2-1; mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const deselect=e.button===2;
      if(substep===2||substep===3){
        const hits=raycaster.intersectObject(clickFillMesh,false);
        if(hits.length){ const fi=Math.floor(hits[0].faceIndex/facesPerClick);
          if(fi!==undefined && fi>=0 && fi<F){
            if(deselect){ if(substep===2){ if(lastFace===fi) lastFace=null; } else if(selT.has(fi)){ selT.delete(fi); sumExcess-=ctx.triExcessRad(un3(verts[faces[fi][0]]),un3(verts[faces[fi][1]]),un3(verts[faces[fi][2]])); } }
            else if(substep===2){ lastFace=fi; selT.clear(); }
            else { if(allTri){ selT.clear(); sumExcess=0; allTri=false; } if(!selT.has(fi)){ selT.add(fi); sumExcess+=ctx.triExcessRad(un3(verts[faces[fi][0]]),un3(verts[faces[fi][1]]),un3(verts[faces[fi][2]])); } }
            allTri=false; renderHighlights(); updatePanel(); setAllBtnClass(); } }
      } else if(substep===4){
        const hits=raycaster.intersectObject(clickFillMesh,false);
        if(hits.length){ const pt=hits[0].point; let bv=-1,bd=1e9;
          for(let i=0;i<verts.length;i++){ const v=verts[i]; const d=Math.hypot(v[0]-pt.x,v[1]-pt.y,v[2]-pt.z); if(d<bd){bd=d;bv=i;} }
          if(bv>=0){ if(deselect){ selVv.delete(bv); } else if(!selVv.has(bv)){ selVv.add(bv); } allVert=false; renderHighlights(); updatePanel(); setAllBtnClass(); } }
      }
    };
    renderer.domElement.addEventListener('pointerdown',onDown);
    renderer.domElement.addEventListener('pointerup',onUp);
    renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
    ctx.rebuildControls(substepSpecs(),(a,b)=>handleControl(a,b));
    buildSurface(); renderHighlights(); updatePanel(); setAllBtnClass();
    return { onControl:(id,v)=>handleControl(id,v), onFrame(){
      if(animOn && substep===5){ animCount+=1; if(animCount>=3*F){ animCount=3*F; animOn=false; }
        renderHighlights(); updatePanel(); setAllBtnClass(); } }, dispose(){
      renderer.domElement.removeEventListener('pointerdown',onDown); renderer.domElement.removeEventListener('pointerup',onUp); pickingActive=false; } };
  }
}

];
// ============ 导航 ============
const dotsEl=document.getElementById('dots'), prev=document.getElementById('prev'), next=document.getElementById('next');
let cur=0;
function go(i){ cur=Math.max(0,Math.min(STEPS.length-1,i));
  if(activeHandlers&&activeHandlers.dispose) activeHandlers.dispose();
  if(curGroup){ disposeObj(curGroup); curGroup=null; }
  curGroup=new THREE.Group(); scene.add(curGroup); ctx.group=curGroup;
  const step=STEPS[cur];
  asideEl.textContent=step.title; narrativeEl.innerHTML=step.narrative.join('');
  valsEl.innerHTML=''; buildCK(step.checkpoints||[]);
  let ui={};
  try { activeHandlers=step.activate(ctx); }
  catch(err){ valsEl.innerHTML='<div style="color:#e03c31;font-weight:700">激活步骤出错:'+err.message+'</div>'; return; }
  if(step.controls && step.controls.length)
    ui=buildControls(step.controls,(id,v)=>{ if(activeHandlers&&activeHandlers.onControl) activeHandlers.onControl(id,v,ui); });
  if(activeHandlers&&activeHandlers.onReady) activeHandlers.onReady(ui);
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('active',k===cur));
  prev.disabled=cur===0; next.disabled=cur===STEPS.length-1; }
for(let i=0;i<STEPS.length;i++){ const d=document.createElement('div'); d.className='dot'; d.textContent=''+(i+1);
  d.addEventListener('click',()=>go(i)); dotsEl.append(d); }
prev.addEventListener('click',()=>go(cur-1)); next.addEventListener('click',()=>go(cur+1));
function animate(){ requestAnimationFrame(animate);
  if(activeHandlers&&activeHandlers.onFrame) activeHandlers.onFrame();
  controls.update(); renderer.render(scene,camera); }
animate(); go(0);
// 深链接:?step=N 直接跳到某一步(调试/分享用)
try { const sp=new URLSearchParams(location.search).get('step'); if(sp) setTimeout(()=>go(Math.min(STEPS.length-1, +sp-1)), 200); } catch(e){}
</script>
